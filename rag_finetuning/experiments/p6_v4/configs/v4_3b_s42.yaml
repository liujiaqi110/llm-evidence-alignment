# P6-v4 训练配置（在查看任何 test_v4 模型输出之前冻结）。训练配方与 P6-v3 v3_3b_full 完全相同，只有数据（v3 full → v4 full）与种子不同。
run_name: v4_3b_s42
seed: 42
model:
  id: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train: rag_finetuning/experiments/p6_v4/data/v4/full/train.jsonl
  dev: rag_finetuning/experiments/p6_v4/data/v4/dev.jsonl
  max_seq_len: 1024
train:
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.1
  gradient_accumulation_steps: 8
  num_epochs: 3
  optim: paged_adamw_8bit
output:
  root: workspace/runs/p6_v4
