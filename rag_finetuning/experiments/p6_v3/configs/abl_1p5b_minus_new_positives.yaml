# P6-v3 训练配置（在查看任何 test_v3 模型输出之前冻结）。训练配方与 P6-v1 qlora_r8.yaml 相同，仅数据与基础模型不同。
run_name: abl_1p5b_minus_new_positives
seed: 42
model:
  id: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  train: rag_finetuning/experiments/p6_v3/data/v3/minus_new_positives/train.jsonl
  dev: rag_finetuning/experiments/p6_v3/data/v3/dev.jsonl
  variant: minus_new_positives
  max_seq_len: 1024
train:
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.1
  gradient_accumulation_steps: 8
  num_epochs: 3            # 最多 3 个 epoch；停止点由开发集按预注册规则选择（消融使用主模型选出的 epoch 数）
  optim: paged_adamw_8bit
output:
  root: workspace/runs/p6_v3
